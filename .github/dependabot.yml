# Dependabot — weekly version updates for the GitHub Actions pinned in .github/workflows/.
# One grouped PR per week. Labels are the tofu-managed ones (terraform/github-labels.tf),
# so Dependabot does not create its own default labels.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - ci
      - deps
    groups:
      github-actions:
        patterns:
          - "*"
