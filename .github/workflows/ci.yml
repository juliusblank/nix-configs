# CI — runs on every PR and on nix-relevant pushes to main.
#
# Job flow:
#   changes          — detects which file groups changed (skipped on release branches)
#   check-flake      — nix flake check + matrix build of both hosts; only when nix files changed.
#                      On merge to main and same-repo PRs it also signs and pushes each
#                      closure to the S3 cache (seeds new paths before merge)
#   validate-release — tag + changelog checks; only on chore/release-* branches
#   ci-passed        — fan-in aggregator; always runs; the single required status check
#
# ci-passed is the required branch-protection status check so PRs are never
# blocked by a check that didn't fire due to path or branch conditions.
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'shell.nix'
      - 'hosts/**'
      - 'home/**'
      - 'overlays/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC
  contents: read

# A new push to a PR supersedes the running build: cancel it to save macOS minutes.
# A running build on main is never cancelled; if several merges queue up, GitHub keeps
# only the newest pending run, whose closure contains the latest state anyway.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which file groups changed. Skipped on release branches since those
  # only touch CHANGELOG.md and are handled by validate-release instead.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'chore/release-')"
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'shell.nix'
              - 'hosts/**'
              - 'home/**'
              - 'overlays/**'
              - '.github/workflows/ci.yml'

  # Build both macOS hosts in parallel matrix jobs — cuts wall-clock roughly in half
  # vs. sequential builds. `nix flake check --no-build` runs on the serenity leg only,
  # since evaluation is identical across hosts. Skipped when no nix-relevant files
  # changed, and skipped entirely on release branches (changes job is skipped there).
  #
  # The same leg then pushes its closure to the S3 cache, so the closure is built once
  # (a separate push job rebuilt it on a fresh runner). The build needs no AWS
  # credentials: the cache bucket is public-read. Credentials are fetched only right
  # before the push, so the 1h OIDC session cannot expire during a long build.
  check-flake:
    name: Build (${{ matrix.host }})
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: macos-15
    env:
      PUSH_CACHE: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') }}
    # `fail-fast: false` — surface errors on both hosts even if one fails first;
    # avoids a re-run cycle to see what the other host would have reported.
    strategy:
      fail-fast: false
      matrix:
        host: [serenity, concinnity]
    steps:
      - uses: actions/checkout@v4

      # v31+ installs a Nix whose installer puts the build users at UID 351+ on
      # macOS 15; the v27 installer used 301-306, which macOS 15 already uses.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://juliusblank-nix-cache.s3.eu-central-1.amazonaws.com
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= juliusblank-nix-cache:4dcYEtIVp1o7kLv6cGGYoMTMhg83XmSjfNA9l+In+SI=

      # Flake check is host-agnostic; run once (serenity leg) to save minutes.
      - name: Nix flake check
        if: matrix.host == 'serenity'
        run: nix flake check --no-build

      - name: Build ${{ matrix.host }}
        run: nix build .#darwinConfigurations.${{ matrix.host }}.system

      # Cache push: merge to main and same-repo PRs only. Fork PRs and Dependabot PRs
      # get no repository secrets or OIDC role, so they only build. A failure in any
      # cache step does not fail the build (it never blocked a merge before either);
      # check the step logs when the cache looks cold.
      - name: Configure AWS credentials (OIDC)
        if: env.PUSH_CACHE == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Load signing key from 1Password
        if: env.PUSH_CACHE == 'true'
        continue-on-error: true
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NIX_CACHE_SIGNING_KEY: "op://github_nix-configs/Nix Cache Signing Key/private_key"

      - name: Push closure to S3 cache
        if: env.PUSH_CACHE == 'true'
        continue-on-error: true
        run: |
          # The key file is removed on every exit path, not only on success.
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$NIX_CACHE_SIGNING_KEY" > "$key_file"
          store_path=$(readlink result)
          nix store sign --key-file "$key_file" --recursive "$store_path"
          nix copy --to "s3://${{ vars.NIX_CACHE_BUCKET }}?region=eu-central-1" "$store_path"

  # Fast release-specific checks. Only runs on chore/release-* branches.
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'chore/release-')
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and changelog
        run: |
          tag="${GITHUB_HEAD_REF#chore/release-}"
          echo "==> Validating release: ${tag}"

          # Tag must exist on the remote
          if ! git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "ERROR: tag ${tag} not found on remote"
            exit 1
          fi

          # CHANGELOG.md must contain a section header for this tag
          if ! grep -q "## ${tag}" CHANGELOG.md; then
            echo "ERROR: no section for ${tag} found in CHANGELOG.md"
            exit 1
          fi

          # No conflict markers
          if grep -qE '^(<<<<<<<|=======|>>>>>>>)' CHANGELOG.md; then
            echo "ERROR: conflict markers found in CHANGELOG.md"
            exit 1
          fi

          echo "==> All release checks passed for ${tag}"

  # Fan-in aggregator — always runs, always the required status check.
  # Passes if every job that ran succeeded; skipped jobs count as passing.
  # `check-flake` is a matrix; its result aggregates ("failure" if any leg fails).
  ci-passed:
    name: CI passed
    needs: [changes, check-flake, validate-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.check-flake.result }}"
            "${{ needs.validate-release.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required job failed or was cancelled"
              echo "  changes:          ${{ needs.changes.result }}"
              echo "  check-flake:      ${{ needs.check-flake.result }}"
              echo "  validate-release: ${{ needs.validate-release.result }}"
              exit 1
            fi
          done
          echo "  changes:          ${{ needs.changes.result }}"
          echo "  check-flake:      ${{ needs.check-flake.result }}"
          echo "  validate-release: ${{ needs.validate-release.result }}"
          echo "All checks passed or were skipped"
